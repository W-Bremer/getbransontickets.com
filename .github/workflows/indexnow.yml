name: IndexNow ping

# Tell Bing (and IndexNow partners) to recrawl after every production deploy.
# The key in scripts/indexnow-ping.mjs is public by protocol design, so this
# needs no secrets. The sleep gives Vercel time to finish building master
# before we ask engines to fetch the new pages.
on:
  push:
    branches: [master]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Vercel deploy
        run: sleep 180
      - name: Submit sitemap URLs to IndexNow
        run: node scripts/indexnow-ping.mjs
